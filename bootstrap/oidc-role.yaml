AWSTemplateFormatVersion: "2010-09-09"
Description: >
  GitHub Actions OIDC provider and a CI role for coldlab. The role starts with
  no permissions on purpose: Phase 0 proves authentication, not authorization.

Parameters:
  GitHubOwner:
    Type: String
    Default: johnallred
  GitHubRepo:
    Type: String
    Default: coldlab
  GitHubBranch:
    Type: String
    Default: main
    Description: Trust is scoped to this one branch. Widen deliberately, not by default.
  SubjectClaim:
    Type: String
    Default: "repo:johnallred@7398042/coldlab@1463740861:ref:refs/heads/main"
    Description: >
      The exact `sub` claim GitHub sends, matched with StringEquals.

      Note the numeric ids. GitHub can issue the subject in an immutable form
      that appends the owner id and the repository id to their names, so the
      claim reads `repo:owner@1234/repo@5678:ref:refs/heads/main` rather than
      `repo:owner/repo:ref:refs/heads/main`. That is the safer form: deleting a
      repository and recreating it under the same name produces a new id, so
      the recreated repository does not inherit this role's access.

      It is also invisible from the AWS side. A trust policy written against
      the plain names looks entirely correct and rejects every token. If this
      role stops being assumable, print the claim in the workflow and compare,
      rather than re-reading the policy.

  CreateOIDCProvider:
    Type: String
    Default: "yes"
    AllowedValues: ["yes", "no"]
    Description: >
      Set to "no" only when some *other* stack already owns a GitHub OIDC
      provider in this account. A second provider for the same URL fails with
      EntityAlreadyExists.

      Once this stack has created the provider, never flip this to "no" on an
      update. CloudFormation owns the resource, so flipping the condition
      deletes it, and the role is left trusting a provider ARN with nothing
      behind it. STS then rejects every token with "The web identity token
      provided could not be validated", which reads like a claims problem and
      is not one. An empty `aws iam list-open-id-connect-providers` is the tell.

      `aws cloudformation deploy` re-sends template defaults for any parameter
      you omit, so state every parameter on every deploy rather than trusting
      the previous value to persist.

Conditions:
  ShouldCreateProvider: !Equals [!Ref CreateOIDCProvider, "yes"]

Resources:
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      # CloudFormation requires this property. AWS no longer uses it to
      # validate GitHub's certificate chain, so treat it as a formality rather
      # than a value to keep current. Verify before relying on either claim.
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  CIRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "coldlab-ci-${GitHubRepo}"
      Description: Assumed by GitHub Actions in coldlab via OIDC.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Exact match, not StringLike. A wildcard such as
                # repo:owner/*:* would let any repository you own assume this
                # role, which is the standard OIDC misconfiguration.
                token.actions.githubusercontent.com:sub: !Ref SubjectClaim
      # No policies in Phase 0. sts:GetCallerIdentity needs none, so the smoke
      # test proves the trust relationship works and nothing more.
      #
      # Phase 1 adds the CDK deploy path here. The clean pattern is to let this
      # role assume the roles `cdk bootstrap` creates rather than granting it
      # broad permissions directly. Take the exact role names and the
      # qualifier from your own bootstrap output; do not copy them from memory.
      #
      # Policies:
      #   - PolicyName: AssumeCdkBootstrapRoles
      #     PolicyDocument:
      #       Version: "2012-10-17"
      #       Statement:
      #         - Effect: Allow
      #           Action: sts:AssumeRole
      #           Resource:
      #             - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-<qualifier>-deploy-role-${AWS::AccountId}-${AWS::Region}"
      #             - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-<qualifier>-file-publishing-role-${AWS::AccountId}-${AWS::Region}"
      #             - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-<qualifier>-lookup-role-${AWS::AccountId}-${AWS::Region}"

Outputs:
  CIRoleArn:
    Description: Set this as the repository variable AWS_ROLE_ARN.
    Value: !GetAtt CIRole.Arn
