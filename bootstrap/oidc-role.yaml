AWSTemplateFormatVersion: "2010-09-09"
Description: >
  GitHub Actions OIDC provider and a CI role for coldlab. The role starts with
  no permissions on purpose: Phase 0 proves authentication, not authorization.

Parameters:
  GitHubOwner:
    Type: String
    Default: johnallred
  GitHubRepo:
    Type: String
    Default: coldlab
  GitHubBranch:
    Type: String
    Default: main
    Description: Trust is scoped to this one branch. Widen deliberately, not by default.
  SubjectClaim:
    Type: String
    Default: "repo:johnallred@7398042/coldlab@1463740861:ref:refs/heads/main"
    Description: >
      The exact `sub` claim GitHub sends, matched with StringEquals.

      Note the numeric ids. GitHub can issue the subject in an immutable form
      that appends the owner id and the repository id to their names, so the
      claim reads `repo:owner@1234/repo@5678:ref:refs/heads/main` rather than
      `repo:owner/repo:ref:refs/heads/main`. That is the safer form: deleting a
      repository and recreating it under the same name produces a new id, so
      the recreated repository does not inherit this role's access.

      It is also invisible from the AWS side. A trust policy written against
      the plain names looks entirely correct and rejects every token. If this
      role stops being assumable, print the claim in the workflow and compare,
      rather than re-reading the policy.

  CdkQualifier:
    Type: String
    Default: hnb659fds
    Description: >
      The qualifier `cdk bootstrap` used, which appears in the names of the
      roles it created. `hnb659fds` is the default and is what this account
      has. Read it from `aws iam list-roles` rather than assuming.

  LabStackName:
    Type: String
    Default: ColdlabSqsRetry
    Description: >
      The lab stack's name, used to scope the CI role's permissions to the
      resources that stack creates. CDK names resources with this as a prefix.

  LabBucketPrefix:
    Type: String
    Default: coldlabsqsretry
    Description: >
      The lowercased stack name, which is how CDK prefixes the landing bucket.
      S3 bucket names cannot contain uppercase letters, so this cannot simply
      reuse LabStackName.

  CreateOIDCProvider:
    Type: String
    Default: "yes"
    AllowedValues: ["yes", "no"]
    Description: >
      Set to "no" only when some *other* stack already owns a GitHub OIDC
      provider in this account. A second provider for the same URL fails with
      EntityAlreadyExists.

      Once this stack has created the provider, never flip this to "no" on an
      update. CloudFormation owns the resource, so flipping the condition
      deletes it, and the role is left trusting a provider ARN with nothing
      behind it. STS then rejects every token with "The web identity token
      provided could not be validated", which reads like a claims problem and
      is not one. An empty `aws iam list-open-id-connect-providers` is the tell.

      `aws cloudformation deploy` re-sends template defaults for any parameter
      you omit, so state every parameter on every deploy rather than trusting
      the previous value to persist.

Conditions:
  ShouldCreateProvider: !Equals [!Ref CreateOIDCProvider, "yes"]

Resources:
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      # CloudFormation requires this property. AWS no longer uses it to
      # validate GitHub's certificate chain, so treat it as a formality rather
      # than a value to keep current. Verify before relying on either claim.
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  CIRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "coldlab-ci-${GitHubRepo}"
      Description: Assumed by GitHub Actions in coldlab via OIDC.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Exact match, not StringLike. A wildcard such as
                # repo:owner/*:* would let any repository you own assume this
                # role, which is the standard OIDC misconfiguration.
                token.actions.githubusercontent.com:sub: !Ref SubjectClaim
      # Phase 0 gave this role no permissions: sts:GetCallerIdentity needs
      # none, so the smoke test proved the trust relationship and nothing
      # else. Phase 4 needs a scheduled run to deploy the lab, run it and tear
      # it down, so the permissions arrive here.
      #
      # Two separate needs, and conflating them is how this ends up as
      # AdministratorAccess.
      #
      # 1. `cdk deploy` and `cdk destroy` work by assuming the roles that
      #    `cdk bootstrap` created. This role does not need deploy permissions
      #    itself, only permission to assume those. Role names taken from
      #    `aws iam list-roles` on this account, not from memory.
      # 2. The harness also runs plain `aws` commands under this role's own
      #    identity: send and read messages, list the bucket, read the stack
      #    outputs, query tags, and resolve each tagged ARN against its
      #    service. Those need their own grants, scoped by resource wherever
      #    the service supports it.
      Policies:
        - PolicyName: AssumeCdkBootstrapRoles
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sts:AssumeRole
                Resource:
                  # cfn-exec-role is deliberately absent: CloudFormation
                  # assumes it, not the deployer. image-publishing-role is
                  # absent because this lab publishes no container image
                  # assets; add it if that ever changes.
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-${CdkQualifier}-deploy-role-${AWS::AccountId}-${AWS::Region}"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-${CdkQualifier}-file-publishing-role-${AWS::AccountId}-${AWS::Region}"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-${CdkQualifier}-lookup-role-${AWS::AccountId}-${AWS::Region}"

              # The CDK CLI confirms the bootstrap version through this
              # parameter before deploying. When it cannot read it, the error
              # talks about bootstrap stack versions and says nothing useful,
              # which is how a region mistake once looked like a bootstrap
              # problem for twenty minutes.
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cdk-bootstrap/${CdkQualifier}/version"

        - PolicyName: RunAndVerifyTheLab
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                Resource: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${LabStackName}/*"

              - Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:ReceiveMessage
                  - sqs:GetQueueAttributes
                  - sqs:GetQueueUrl
                Resource: !Sub "arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:${LabStackName}-*"

              # `aws s3 ls s3://bucket/prefix/` needs ListBucket on the
              # bucket, not GetObject on its contents. The harness never reads
              # an object, only checks that a key exists.
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:${AWS::Partition}:s3:::${LabBucketPrefix}-*"

              # Teardown verification. tag:GetResources supports no
              # resource-level permissions, so "*" is the only form it has;
              # it is a read of tags across the account and nothing more.
              - Effect: Allow
                Action: tag:GetResources
                Resource: "*"

              # Resolving a tagged ARN against the service that owns it,
              # because the tagging API is an eventually-consistent index and
              # an ARN it returns is a question rather than a verdict. All
              # reads. GetEventSourceMapping is keyed by UUID and supports no
              # useful resource scoping.
              - Effect: Allow
                Action: lambda:GetEventSourceMapping
                Resource: "*"
              - Effect: Allow
                Action: lambda:GetFunction
                Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${LabStackName}-*"
              - Effect: Allow
                Action: iam:GetRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${LabStackName}-*"

Outputs:
  CIRoleArn:
    Description: Set this as the repository variable AWS_ROLE_ARN.
    Value: !GetAtt CIRole.Arn
