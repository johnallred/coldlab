name: OIDC smoke

# Proves CI can obtain AWS credentials without any stored key. It asserts the
# trust relationship and nothing else: `sts get-caller-identity` needs no
# permissions, so this stays a pure authentication check even though the role
# has since gained the two policies the scheduled run needs.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # required to request the OIDC token
  contents: read

jobs:
  assume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Diagnostic. The trust policy matches on `sub` and `aud`, and when a
      # correct-looking policy still rejects a token the only way forward is to
      # read the claims the token actually carries. Prints three claims, never
      # the token itself.
      - name: Show the OIDC claims this run sends
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, urllib.request
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com"
          req = urllib.request.Request(
              url,
              headers={"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]},
          )
          token = json.load(urllib.request.urlopen(req))["value"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for key in ("sub", "aud", "repository", "ref", "event_name"):
              print(f"{key} = {claims.get(key)!r}")
          PY

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-2
          role-session-name: coldlab-oidc-smoke

      - name: Confirm the identity is the expected role
        run: |
          set -euo pipefail
          arn=$(aws sts get-caller-identity --query Arn --output text)
          echo "assumed: $arn"
          case "$arn" in
            *:assumed-role/coldlab-ci-*) echo "ok" ;;
            *) echo "unexpected identity: $arn" >&2; exit 1 ;;
          esac
